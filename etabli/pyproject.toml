[project]
name = "etabli"
version = "0.1.0"
description = "Établi — atelier local d'analyse quantitative d'enquêtes par questionnaire pour les sciences sociales"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.15",
    "statsmodels>=0.14.4",
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
]

[project.scripts]
etabli = "etabli.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etabli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
